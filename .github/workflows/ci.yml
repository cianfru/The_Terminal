name: CI

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - name: Install City 2.0 prototype dependencies
        run: npm ci --prefix prototypes/spx-city-2.0
      - name: Build City 2.0 prototype
        run: npm run build --prefix prototypes/spx-city-2.0
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
